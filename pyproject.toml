[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-change"
version = "0.4.0"
description = "Delta-like change/worktree/review orchestration on top of herdr"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
herdr-change = "herdr_change:main"

[tool.setuptools]
py-modules = ["herdr_change"]
