[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-thread"
version = "0.3.0"
description = "Delta-like thread/worktree/review orchestration on top of herdr"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
herdr-thread = "herdr_thread:main"

[tool.setuptools]
py-modules = ["herdr_thread"]
